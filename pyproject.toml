[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegisflow"
version = "0.1.0"
description = "AegisFlow —— 企业级 AI 事件调查与自动处置平台（受控 Agent 工程学习项目）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "YangZhiquan" }]
dependencies = [
    # Web / 校验
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    # HTTP（模型调用适配层，阶段 4）
    "httpx>=0.27",
    # 持久化（MySQL，阶段 1）
    "sqlalchemy>=2.0",
    "aiomysql>=0.2",
    "pymysql>=1.1",
    "alembic>=1.13",
    # 工作流编排（阶段 3）
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
