# 本地开发环境：MySQL 8（阶段 1 起使用）。
# 用法：docker compose up -d
#
# 为什么配 healthcheck：应用与测试要等 MySQL **真正就绪** 才能连，
# "容器启动" != "可接受连接"，初始化需要几秒。
services:
  mysql:
    image: mysql:8.0
    container_name: aegisflow-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aegisflow
      MYSQL_USER: aegis
      MYSQL_PASSWORD: aegis
    ports:
      - "3306:3306"
    volumes:
      - aegisflow-mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  aegisflow-mysqldata:
