# 本地开发环境：PostgreSQL（阶段 03）。Redis 在阶段 03b 加入。
# 用法：docker compose up -d
#
# 为什么给 PG 配 healthcheck：应用容器（以及测试）要等它**真正就绪**
# 才能连 —— "容器启动了"不等于"能接受连接"，PG 初始化要几秒。
services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5432:5432"
    volumes:
      - agent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  agent-pgdata: